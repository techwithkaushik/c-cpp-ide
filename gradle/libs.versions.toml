activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigationCompose = "2.9.4"
hilt = "2.57.1"
androidxHilt = "1.3.0"
coroutines = "1.10.2"
serialization = "1.9.0"
documentfile = "1.0.1"
documentprovider = "1.0.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
