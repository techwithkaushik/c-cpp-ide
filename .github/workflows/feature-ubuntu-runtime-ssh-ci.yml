name: Feature Branch Android CI

on:
  push:
    branches:
      - feature/ubuntu-runtime-ssh
  pull_request:
    branches:
      - feature/ubuntu-runtime-ssh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ubuntu-runtime-ssh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and test Android variants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Verify Git-derived version metadata
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-parse --short=7 HEAD
          git rev-list --count HEAD

      - name: Compile all debug APK variants
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
