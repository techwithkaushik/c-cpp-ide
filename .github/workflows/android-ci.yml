name: Code Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-studio-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"

jobs:
  verify-test-build:
    name: Verify, test and build ARM32 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify vendored Termux source and dependencies
        run: bash scripts/verify-termux-vendor.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle with dependency and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run ARM32 unit tests and build optimized release APK
        run: >-
          gradle --no-daemon --build-cache --parallel
          :integrations:toolchain:testDebugUnitTest
          :integrations:termux-runtime:testDebugUnitTest
          :app:testArm32DebugUnitTest
          :app:assembleArm32Release

      - name: Report APK size and verify no bootstrap is bundled
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/arm32/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          size_bytes="$(stat -c '%s' "$apk")"
          echo "Optimized ARM32 release APK: $apk"
          echo "APK size: $(( (size_bytes + 1023) / 1024 )) KiB ($size_bytes bytes)"
          if unzip -Z1 "$apk" | grep -E '(^|/)(bootstrap|bootstrap\.zip)(/|$)' >/dev/null; then
            echo "::error::Bootstrap payload unexpectedly found inside APK."
            exit 1
          fi
          echo "Verified: bootstrap ZIP is not bundled in the APK."

      - name: Upload optimized ARM32 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-arm32-release-apk
          path: app/build/outputs/apk/arm32/release/*.apk
          if-no-files-found: error
          retention-days: 14
