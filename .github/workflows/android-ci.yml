name: Android Release Build

on:
  # Run once per pushed commit. Avoid duplicate push + pull_request builds
  # for the same branch; PRs still display the commit's push check.
  push:
    branches: [main, architecture/termux-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch push and any manual run on that branch share one active build.
  group: android-release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-bootstrap:
    name: Build matching Termux bootstrap (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm
            abi: armeabi-v7a
          - architecture: aarch64
            abi: arm64-v8a
          - architecture: i686
            abi: x86
          - architecture: x86_64
            abi: x86_64
    env:
      TERMUX_PACKAGES_REF: fb44d31f3445d7efd2cee6dada47aa19401c1329
      CODE_STUDIO_PACKAGE: com.techwithkaushik.cppide
      # Ensure the builder container sees the app identity before its startup cleanup.
      TERMUX_DOCKER_RUN_EXTRA_ARGS: --env TERMUX_APP__PACKAGE_NAME=com.techwithkaushik.cppide --env TERMUX_APP_PACKAGE=com.techwithkaushik.cppide --env TERMUX__ROOTFS=/data/data/com.techwithkaushik.cppide/files --env TERMUX__PREFIX=/data/data/com.techwithkaushik.cppide/files/usr
      TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env TERMUX_APP__PACKAGE_NAME=com.techwithkaushik.cppide --env TERMUX_APP_PACKAGE=com.techwithkaushik.cppide --env TERMUX__ROOTFS=/data/data/com.techwithkaushik.cppide/files --env TERMUX__PREFIX=/data/data/com.techwithkaushik.cppide/files/usr
    steps:
      - name: Checkout pinned Termux packages source
        uses: actions/checkout@v4
        with:
          repository: agnostic-apollo/termux-packages
          ref: fb44d31f3445d7efd2cee6dada47aa19401c1329
          path: termux-packages

      - name: Refresh checksum for re-generated upstream foot archive
        shell: bash
        run: |
          set -euo pipefail
          # Codeberg re-generated the foot 1.23.1 source archive without changing
          # the pinned package version. CI logs recorded this new SHA-256 from
          # the downloaded archive; fail closed if the recipe has drifted.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("termux-packages/x11-packages/foot/build.sh")
          text = p.read_text()
          old = "TERMUX_PKG_SHA256=02072b8f0aaf26907b6b02293c875539ce52fc59079344e7cf811ab03394cfa3"
          new = "TERMUX_PKG_SHA256=b3fa774983abb5f95aecca4557d146091d8666bc65fb310d4d3e38327357ade9"
          if text.count(old) != 1:
              raise SystemExit("Expected pinned foot 1.23.1 checksum was not found exactly once")
          p.write_text(text.replace(old, new))
          PY

      - name: Configure Code Studio package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("termux-packages/scripts/properties.sh")
          content = p.read_text()
          pattern = r'(?m)^\s*(?:export\s+)?TERMUX_APP__PACKAGE_NAME\s*=.*'
          matches = list(re.finditer(pattern, content))
          if len(matches) != 1:
              raise SystemExit(f"Expected one package identity assignment; found {len(matches)}")
          line = matches[0].group(0)
          indent = re.match(r'^\s*', line).group(0)
          prefix = "export " if line.lstrip().startswith("export ") else ""
          replacement = f'{indent}{prefix}TERMUX_APP__PACKAGE_NAME="{os.environ["CODE_STUDIO_PACKAGE"]}"'
          p.write_text(content[:matches[0].start()] + replacement + content[matches[0].end():])
          PY

      - name: Restore cached bootstrap for this source and ABI
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: termux-packages/bootstrap-${{ matrix.architecture }}.zip
          key: code-studio-bootstrap-fb44d31f3445d7efd2cee6dada47aa19401c1329-com.techwithkaushik.cppide-${{ matrix.architecture }}-v3

      - name: Build bootstrap with matching Android NDK
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd termux-packages
          # The pinned infra-improvs source requires NDK r28c. The published
          # package-builder image may contain an older NDK, so install the exact
          # SDK/NDK version declared by scripts/properties.sh inside the container
          # before attempting to compile packages.
          ./scripts/run-docker.sh bash -lc '
            set -euo pipefail
            cd /home/builder/termux-packages
            . ./scripts/properties.sh
            ./scripts/setup-android-sdk.sh
            test -d "$NDK"
            grep -q "Pkg.Revision = 28" "$NDK/source.properties"
            ./scripts/build-bootstraps.sh --no-build-unneeded-subpackages --architectures "${{ matrix.architecture }}"
          ' 2>&1 | tee ../bootstrap-build.log

      - name: Validate bootstrap and create metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="termux-packages/bootstrap-${{ matrix.architecture }}.zip"
          test -s "$archive"
          python3 - "$archive" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = {n.rstrip("/") for n in z.namelist()}
              for directory in ("bin", "etc", "lib", "share"):
                  if not any(n == directory or n.startswith(directory + "/") for n in names):
                      raise SystemExit(f"Bootstrap missing {directory}/")
              if not any(n in names for n in ("bin/sh", "bin/bash")):
                  raise SystemExit("Bootstrap missing bin/sh or bin/bash")
              if "SYMLINKS.txt" not in names:
                  raise SystemExit("Bootstrap missing SYMLINKS.txt")
              links = z.read("SYMLINKS.txt").decode("utf-8", errors="strict")
              if "/data/data/com.termux/files/usr" in links:
                  raise SystemExit("Bootstrap contains stock Termux prefix")
              if z.testzip() is not None:
                  raise SystemExit("Bootstrap archive contains a corrupt entry")
          PY
          mkdir -p dist
          cp "$archive" dist/bootstrap.zip
          sha256="$(sha256sum dist/bootstrap.zip | awk '{print $1}')"
          cat > dist/bootstrap.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "$CODE_STUDIO_PACKAGE",
            "prefix": "/data/data/$CODE_STUDIO_PACKAGE/files/usr",
            "abi": "${{ matrix.abi }}",
            "architecture": "${{ matrix.architecture }}",
            "version": "termux-packages-infra-improvs-$TERMUX_PACKAGES_REF",
            "sha256": "$sha256",
            "upstreamRepository": "https://github.com/agnostic-apollo/termux-packages",
            "upstreamCommit": "$TERMUX_PACKAGES_REF",
            "validatedByCI": true,
            "status": "Built from pinned source and validated automatically by CI; device runtime smoke test remains separate"
          }
          EOF
          cat dist/bootstrap.json

      - name: Upload generated ABI bootstrap for APK packaging
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-bootstrap-${{ matrix.abi }}
          path: |
            dist/bootstrap.zip
            dist/bootstrap.json
          if-no-files-found: error
          retention-days: 2

  native-embedding-smoke:
    name: Compile and verify native bootstrap embedding (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create synthetic bootstrap fixtures
        run: bash scripts/create-bootstrap-fixtures.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build all ABI debug APKs with synthetic fixtures
        env:
          BOOTSTRAP_ALLOW_UNAPPROVED: "1"
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify ABI-specific native libraries
        env:
          BUILD_TYPE: debug
        run: bash scripts/verify-bootstrap-apks.sh

      - name: Upload arm32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-armeabi-v7a
          path: app/build/outputs/apk/arm32/debug/app-arm32-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-arm64-v8a
          path: app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-x86
          path: app/build/outputs/apk/x86/debug/app-x86-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-x86_64
          path: app/build/outputs/apk/x64/debug/app-x64-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed release APK
    needs: [build-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored Termux source
        run: bash scripts/verify-termux-vendor.sh

      # Fail closed: never publish an APK that silently omits its ABI-matched runtime.
      - name: Verify and stage pinned ABI bootstrap artifacts
        run: bash scripts/prepare-bootstrap-assets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile vendored Termux modules
        run: >-
          gradle --no-daemon
          :integrations:termux-upstream:terminal-emulator:assembleDebug
          :integrations:termux-upstream:terminal-view:assembleDebug
          :integrations:termux-upstream:termux-am-library:assembleDebug
          :integrations:termux-upstream:termux-shared:assembleDebug

      - name: Run runtime installer tests
        run: gradle --no-daemon :integrations:termux-runtime:testDebugUnitTest

      - name: Restore development signing key
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Assemble release APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify each release APK contains its matching bootstrap
        env:
          BUILD_TYPE: release
        run: bash scripts/verify-bootstrap-apks.sh

      - name: Upload arm32 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-armeabi-v7a
          path: app/build/outputs/apk/arm32/release/app-arm32-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-arm64-v8a
          path: app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-x86
          path: app/build/outputs/apk/x86/release/app-x86-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-x86_64
          path: app/build/outputs/apk/x64/release/app-x64-release.apk
          if-no-files-found: error
          retention-days: 14
