name: Android Release Build

on:
  # Run once per pushed commit. Avoid duplicate push + pull_request builds
  # for the same branch; PRs still display the commit's push check.
  push:
    branches: [main, architecture/termux-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch push and any manual run on that branch share one active build.
  group: android-release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  native-embedding-smoke:
    name: Compile and verify native bootstrap embedding (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create synthetic bootstrap fixtures
        run: bash scripts/create-bootstrap-fixtures.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build all ABI debug APKs with synthetic fixtures
        env:
          BOOTSTRAP_ALLOW_UNAPPROVED: "1"
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify ABI-specific native libraries
        env:
          BUILD_TYPE: debug
        run: bash scripts/verify-bootstrap-apks.sh

      - name: Upload arm32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-armeabi-v7a
          path: app/build/outputs/apk/arm32/debug/app-arm32-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-arm64-v8a
          path: app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-x86
          path: app/build/outputs/apk/x86/debug/app-x86-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-x86_64
          path: app/build/outputs/apk/x64/debug/app-x64-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored Termux source
        run: bash scripts/verify-termux-vendor.sh

      # Fail closed: never publish an APK that silently omits its ABI-matched runtime.
      - name: Verify and stage pinned ABI bootstrap artifacts
        run: bash scripts/prepare-bootstrap-assets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile vendored Termux modules
        run: >-
          gradle --no-daemon
          :integrations:termux-upstream:terminal-emulator:assembleDebug
          :integrations:termux-upstream:terminal-view:assembleDebug
          :integrations:termux-upstream:termux-am-library:assembleDebug
          :integrations:termux-upstream:termux-shared:assembleDebug

      - name: Run runtime installer tests
        run: gradle --no-daemon :integrations:termux-runtime:testDebugUnitTest

      - name: Restore development signing key
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Assemble release APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify each release APK contains its matching bootstrap
        env:
          BUILD_TYPE: release
        run: bash scripts/verify-bootstrap-apks.sh

      - name: Upload arm32 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-armeabi-v7a
          path: app/build/outputs/apk/arm32/release/app-arm32-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-arm64-v8a
          path: app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-x86
          path: app/build/outputs/apk/x86/release/app-x86-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-x86_64
          path: app/build/outputs/apk/x64/release/app-x64-release.apk
          if-no-files-found: error
          retention-days: 14
