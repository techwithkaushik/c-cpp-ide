name: Code Studio CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-studio-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  TERMUX_PACKAGES_REF: "21700256be43a0c8aae38bacecdac87c5ded4cc6"
  CODE_STUDIO_PACKAGE: "com.techwithkaushik.cppide"
  BOOTSTRAP_VERSION: "0.1.0-ci.${{ github.run_number }}"

jobs:
  verify:
    name: 1 · Verify source and Gradle configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify vendored Termux source and dependencies
        run: bash scripts/verify-termux-vendor.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate Gradle project configuration
        run: gradle --no-daemon help

  test:
    name: 2 · Test all modules and ABI variants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Compile vendored Termux modules and run integration tests
        run: >-
          gradle --no-daemon
          :integrations:termux-upstream:terminal-emulator:assembleDebug
          :integrations:termux-upstream:terminal-view:assembleDebug
          :integrations:termux-upstream:termux-am-library:assembleDebug
          :integrations:termux-upstream:termux-shared:assembleDebug
          :integrations:toolchain:testDebugUnitTest
          :integrations:termux-runtime:testDebugUnitTest

      - name: Run app unit tests for every supported ABI
        run: >-
          gradle --no-daemon
          :app:testArm32DebugUnitTest
          :app:testArm64DebugUnitTest
          :app:testX86DebugUnitTest
          :app:testX64DebugUnitTest

  build-bootstrap:
    name: 3 · Build and verify custom bootstrap for all ABIs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: test
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned Termux packages source
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages

      - name: Verify pinned source and configure app package identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C termux-packages rev-parse HEAD)" = "$TERMUX_PACKAGES_REF"
          python3 -  "$destination/bootstrap.json" <<EOF
          {
            "abi": "$abi",
            "version": "$BOOTSTRAP_VERSION",
            "sha256": "$sha"
          }
          EOF
          done
          find "$root" -type f -maxdepth 2 -print

      - name: Upload verified ABI bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abi-bootstrap-artifacts
          path: bootstrap-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    name: 4 · Build APKs and verify embedded bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, build-bootstrap]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download verified bootstrap artifacts
        uses: actions/download-artifact@v4
        with:
          name: abi-bootstrap-artifacts
          path: bootstrap-artifacts

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Re-validate and stage ABI-matched assets
        run: bash scripts/prepare-bootstrap-assets.sh

      - name: Assemble all four ABI APKs
        run: >-
          gradle --no-daemon
          :app:assembleArm32Debug
          :app:assembleArm64Debug
          :app:assembleX86Debug
          :app:assembleX64Debug

      - name: Verify each APK contains its matching bootstrap and checksum
        run: bash scripts/verify-bootstrap-apks.sh

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-abi-debug-apks
          path: |
            app/build/outputs/apk/arm32/debug/*.apk
            app/build/outputs/apk/arm64/debug/*.apk
            app/build/outputs/apk/x86/debug/*.apk
            app/build/outputs/apk/x64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
