name: Code Studio CI

on:
  push:
    branches: [main, 'feature/ubuntu-runtime-ssh']
  pull_request:
    branches: [main, feature/ubuntu-runtime-ssh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-studio-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.8.2"

jobs:
  release:
    name: Build and verify signed arm32 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Gradle derives versionCode from the complete branch history.
          fetch-depth: 0

      - name: Package current branch source snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/code-studio-source"
          mkdir -p "$snapshot_dir"
          git archive HEAD | tar -x -C "$snapshot_dir"
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "repository=$GITHUB_REPOSITORY"
          } > "$snapshot_dir/BUILD_SOURCE_INFO.txt"
          tar -czf "$RUNNER_TEMP/code-studio-source.tar.gz" -C "$snapshot_dir" .

      - name: Upload current branch source
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-source-${{ github.ref_name == 'feature/ubuntu-runtime-ssh' && 'feature-ubuntu-runtime-ssh' || github.ref_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/code-studio-source.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Restore repository signing keystore
        id: keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$KEYSTORE_PATH" || { echo "::error::SIGNING_KEYSTORE secret did not restore a non-empty keystore"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "::error::SIGNING_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "::error::SIGNING_KEY_PASSWORD secret is missing"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "::error::SIGNING_STORE_PASSWORD secret is missing"; exit 1; }
          echo "SIGN_KEY_STORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Gradle signing secrets are configured."

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle with dependency and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Locate Android SDK and ensure NDK is available
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          NDK_VERSION="27.2.12479018"
          NDK_BIN="$SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -d "$NDK_BIN" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            if [[ -z "$SDKMANAGER" ]]; then
              echo "::error::Android SDK command-line tools/sdkmanager not found under $SDK_ROOT"
              exit 1
            fi

            # sdkmanager occasionally receives a truncated NDK archive on hosted
            # runners. Retry from a clean package/cache state instead of accepting
            # a half-created ndk/ directory as a successful installation.
            installed=false
            for attempt in 1 2 3; do
              echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
              rm -rf "$SDK_ROOT/ndk/$NDK_VERSION" "$SDK_ROOT/.temp"
              if [[ "$attempt" -gt 1 ]]; then
                rm -rf "$HOME/.android/cache"
              fi
              set +o pipefail
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"
              sdk_status=${PIPESTATUS[1]}
              set -o pipefail
              if [[ "$sdk_status" -eq 0 && -d "$NDK_BIN" ]]; then
                installed=true
                break
              fi
              echo "::warning::NDK installation attempt $attempt did not produce a complete toolchain (sdkmanager exit=$sdk_status)"
              sleep $((attempt * 5))
            done
            [[ "$installed" == true ]] || {
              echo "::error::Could not install a complete Android NDK $NDK_VERSION after 3 attempts"
              exit 1
            }
          fi
          test -x "$NDK_BIN/clang" || {
            echo "::error::Required Android NDK clang compiler is missing under $NDK_BIN"
            exit 1
          }
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build upstream PRoot v5.5.0 for Android ABIs
        shell: bash
        run: bash native-host/build-proot.sh

      - name: Test Linux runtime and SSH integration
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon --build-cache :integrations:linux-runtime:testDebugUnitTest :feature:terminal:testDebugUnitTest

      - name: Build arm32 release APK with Gradle signing
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon --build-cache :app:assembleArm32Release

      - name: Verify APK signature and ensure Linux runtime is app-private
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Could not find Android SDK build-tools apksigner under $sdk_root/build-tools"
            exit 1
          fi
          declare -A APK_DIRS=(
            [arm32]="app/build/outputs/apk/arm32/release"
          )
          for abi in arm32; do
            dir="${APK_DIRS[$abi]}"
            apk="$(find "$dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk" && test -s "$apk" || { echo "::error::Missing release APK for $abi in $dir"; exit 1; }
            "$apksigner" verify --verbose "$apk"
            size_bytes="$(stat -c '%s' "$apk")"
            echo "Verified Gradle-signed $abi APK: $apk ($(( (size_bytes + 1023) / 1024 )) KiB)"
            if unzip -Z1 "$apk" | grep -E '(^|/)(bootstrap|bootstrap\.zip)(/|$)' >/dev/null; then
              echo "::error::Linux runtime payload unexpectedly found inside $apk"
              exit 1
            fi
          done
          echo "Signed arm32 APK verified; Ubuntu rootfs remains a separately installed app-private runtime."

      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-apk-arm32
          path: app/build/outputs/apk/arm32/release/*.apk
          if-no-files-found: error
          retention-days: 14
