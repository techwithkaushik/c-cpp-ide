name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, architecture/termux-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore repository debug keystore
        id: debug-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if base64 --decode ci/debug-keystore.b64 > "$HOME/.android/debug.keystore" 2>/dev/null \
             && keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Reusable repository debug keystore restored and validated."
          else
            rm -f "$HOME/.android/debug.keystore"
            echo "::warning::Repository debug keystore is invalid; using a temporary runner debug key for this CI build. Fix ci/debug-keystore.b64 to enable stable signatures."
          fi

      - name: Validate bootstrap archive tooling
        run: |
          python3 -m unittest tools/test_validate_bootstrap_archive.py -v
          python3 tools/validate-bootstrap-archive.py --help >/dev/null

      - name: Check Gradle project configuration
        run: gradle --no-daemon tasks

      - name: Run unit tests
        run: gradle --no-daemon :integrations:termux:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: cpp-ide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
