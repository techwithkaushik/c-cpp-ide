name: Android Build and Unit Tests

on:
  push:
    branches: [main, architecture/termux-integration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor pinned Termux source modules
        run: bash scripts/vendor-termux-source.sh

      - name: Commit vendored Termux source into the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/termux-upstream/terminal-view integrations/termux-upstream/terminal-emulator integrations/termux-upstream/termux-shared integrations/termux-upstream/LICENSE.md
          if ! git diff --cached --quiet; then
            git commit -m "Vendor upstream Termux terminal source modules"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Termux source already vendored; no commit needed."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
