name: Android Build and Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored Termux source
        run: bash scripts/verify-termux-vendor.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile vendored Termux modules
        run: >-
          gradle --no-daemon
          :integrations:termux-upstream:terminal-emulator:assembleDebug
          :integrations:termux-upstream:terminal-view:assembleDebug
          :integrations:termux-upstream:termux-am-library:assembleDebug
          :integrations:termux-upstream:termux-shared:assembleDebug

      - name: Run runtime installer tests
        run: gradle --no-daemon :integrations:termux-runtime:testDebugUnitTest

      - name: Run app unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
