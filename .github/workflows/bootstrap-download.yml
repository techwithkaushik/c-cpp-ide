name: Build and Upload Code Studio Bootstraps (All ABIs)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-download.yml"
  workflow_dispatch:
  schedule:
    # Refresh all ABI-specific archives weekly.
    - cron: "20 4 * * 1"

permissions:
  contents: read

concurrency:
  group: code-studio-bootstrap-build
  cancel-in-progress: true

jobs:
  build-bootstrap:
    name: Generate app-prefix bootstrap archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install bootstrap generation utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl jq zip xz-utils
      - name: Checkout official Termux package build scripts
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
          path: termux-packages
          persist-credentials: false

      - name: Configure bootstrap for Code Studio's private prefix
        shell: bash
        run: |
          set -euo pipefail
          properties="termux-packages/scripts/properties.sh"
          test -s "$properties"
          # Official stock archives target com.termux and are not relocatable.
          # Generate a fresh archive with this app's package/prefix baked in.
          sed -i 's/com\.termux/com.techwithkaushik.cppide/g' "$properties"
          if grep -q 'com\.termux' "$properties"; then
            echo "::error::Stock Termux package identifier remains in properties.sh"
            exit 1
          fi
          grep -n 'TERMUX_APP__PACKAGE_NAME\|TERMUX_APP__DATA_DIR\|TERMUX__PREFIX\|TERMUX_PREFIX=' "$properties" | sed -n '1,30p'

      - name: Generate all four ABI bootstraps
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-bootstraps.sh --architectures arm,aarch64,i686,x86_64
          mkdir -p ../dist
          for pair in "arm:bootstrap-arm.zip" "aarch64:bootstrap-aarch64.zip" "i686:bootstrap-i686.zip" "x86_64:bootstrap-x86_64.zip"; do
            name="${pair#*:}"
            test -s "$name"
            unzip -tq "$name"
            entries="$(unzip -Z1 "$name")"
            grep -Eq '^bin/' <<< "$entries"
            grep -Eq '^etc/' <<< "$entries"
            grep -Eq '^lib/' <<< "$entries"
            grep -Eq '^share/' <<< "$entries"
            # The archive must carry symlink metadata remapped to this app's prefix.
            unzip -p "$name" SYMLINKS.txt > "../dist/${name%.zip}.SYMLINKS.txt"
            if grep -q '/data/data/com.termux/files/usr' "../dist/${name%.zip}.SYMLINKS.txt"; then
              echo "::error::$name contains stock Termux symlink targets"
              exit 1
            fi
            if ! grep -q '/data/data/com.techwithkaushik.cppide/files/usr' "../dist/${name%.zip}.SYMLINKS.txt"; then
              echo "::error::$name has no Code Studio-specific prefix in its symlink manifest"
              exit 1
            fi
            mv "$name" ../dist/
            echo "Validated $name ($(du -h "../dist/$name" | cut -f1))"
          done
          cd ../dist
          sha256sum bootstrap-*.zip > SHA256SUMS
          printf '%s\n' "Package: com.techwithkaushik.cppide" "Prefix: /data/data/com.techwithkaushik.cppide/files/usr" > PREFIX.txt
          cat > README.txt <<'EOF'
          Code Studio — generated Termux bootstrap archives
          =================================================
          These archives are generated using official Termux bootstrap-generation
          scripts and package repositories, with the application package/prefix
          configured for Code Studio. They are not the stock com.termux archives.

          ABI mapping:
            bootstrap-arm.zip       -> armeabi-v7a (32-bit ARM)
            bootstrap-aarch64.zip   -> arm64-v8a (64-bit ARM)
            bootstrap-i686.zip      -> x86 (32-bit Intel)
            bootstrap-x86_64.zip    -> x86_64 (64-bit Intel)

          In Code Studio, open Settings > Runtime & Bootstrap > Install Bootstrap,
          select the ZIP matching the device ABI, and provide the SHA-256 value
          from SHA256SUMS. The app must still pass its on-device shell smoke test.
          The APK does not bundle any bootstrap archive.
          EOF

      - name: Upload all generated ABI bootstrap archives
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-bootstrap-all-abis-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
