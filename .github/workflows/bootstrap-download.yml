name: Build and Upload Termux Bootstraps (All ABIs)

on:
  workflow_dispatch:
  schedule:
    # Refresh all official ABI bootstrap archives weekly.
    - cron: "20 4 * * 1"

permissions:
  contents: read

concurrency:
  group: termux-bootstrap-all-abis
  cancel-in-progress: true

jobs:
  bootstrap-bundles:
    name: Fetch, verify and package all ABI bootstraps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve latest official release containing every supported ABI
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/termux/termux-packages/releases?per_page=30')"
          asset="$(jq -cer '
            [.[] | select(.tag_name | startswith("bootstrap-")) | . as $r |
              ([ "bootstrap-arm.zip", "bootstrap-aarch64.zip", "bootstrap-i686.zip", "bootstrap-x86_64.zip" ] as $required |
               select(($required - [$r.assets[].name]) | length == 0) |
               {tag: $r.tag_name, assets: [$r.assets[] | select(.name as $n | $required | index($n)) |
                 {name, url: .browser_download_url, digest: (.digest // "")}]})] | first
          ' <<< "$release_json")"
          tag="$(jq -r '.tag' <<< "$asset")"
          [[ -n "$tag" && "$tag" == bootstrap-* ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          jq -c '.assets[]' <<< "$asset" > "$RUNNER_TEMP/bootstrap-assets.jsonl"
          echo "Using official Termux bootstrap release: $tag"
          cat "$RUNNER_TEMP/bootstrap-assets.jsonl"

      - name: Download and verify each ABI archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r asset; do
            name="$(jq -r '.name' <<< "$asset")"
            url="$(jq -r '.url' <<< "$asset")"
            expected="$(jq -r '.digest' <<< "$asset")"
            [[ "$url" == https://github.com/termux/termux-packages/releases/download/*/"$name" ]]
            curl --fail --show-error --location --retry 3 --retry-all-errors "$url" -o "dist/$name"
            test -s "dist/$name"
            unzip -tq "dist/$name"
            # Validate this is a Termux prefix archive, not an unrelated ZIP.
            unzip -Z1 "dist/$name" | grep -Eq '^(bin/|usr/bin/|etc/|share/)'
            actual="sha256:$(sha256sum "dist/$name" | cut -d' ' -f1)"
            if [[ -n "$expected" ]]; then
              [[ "$actual" == "$expected" ]] || { echo "::error::$name upstream SHA-256 mismatch"; exit 1; }
            else
              echo "::error::Official release did not provide a digest for $name; refusing an unverifiable archive."
              exit 1
            fi
            sha256sum "dist/$name" > "dist/$name.sha256"
            echo "Verified $name ($(du -h "dist/$name" | cut -f1)) $actual"
          done < "$RUNNER_TEMP/bootstrap-assets.jsonl"

      - name: Write ABI mapping and installation instructions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > dist/README.txt <<EOF
          Code Studio — Termux bootstrap bundle (all supported ABIs)
          ==========================================================
          Source: official termux/termux-packages release
          Release: $RELEASE_TAG

          Files and Android ABI mapping:
            bootstrap-arm.zip       -> armeabi-v7a (32-bit ARM)
            bootstrap-aarch64.zip   -> arm64-v8a (64-bit ARM)
            bootstrap-i686.zip      -> x86 (32-bit Intel)
            bootstrap-x86_64.zip    -> x86_64 (64-bit Intel)

          Install only the archive matching the device's Android ABI.
          In Code Studio, open Settings > Runtime & Bootstrap > Install Bootstrap,
          select the matching ZIP, and enter the SHA-256 from its .sha256 file.
          Wait for runtime verification to succeed before opening Terminal.

          These are upstream prebuilt Termux bootstrap archives, downloaded and
          verified here; this workflow does not compile Termux packages from source.
          The APK intentionally does not bundle any bootstrap archive.
          EOF
          printf 'release=%s\n' "$RELEASE_TAG" > dist/RELEASE.txt
          (cd dist && sha256sum bootstrap-*.zip > SHA256SUMS)

      - name: Upload all four verified ABI bootstraps
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-termux-bootstrap-all-abis-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
