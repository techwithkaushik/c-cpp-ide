name: Android Bootstrap and ABI APK CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_abi_packaging: ${{ steps.detect.outputs.has_abi_packaging }}
      has_toolchain_module: ${{ steps.detect.outputs.has_toolchain_module }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect bootstrap packaging support in selected ref
        shell: bash
        run: |
          if grep -q 'create("arm32")' app/build.gradle.kts; then
            echo "has_abi_packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_abi_packaging=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q ':integrations:toolchain' settings.gradle.kts; then
            echo "has_toolchain_module=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_toolchain_module=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: detect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests for selected branch
        shell: bash
        run: |
          if [[ "${{ needs.detect.outputs.has_abi_packaging }}" == "true" ]]; then
            gradle --no-daemon \
              :integrations:toolchain:testDebugUnitTest \
              :integrations:termux-runtime:testDebugUnitTest \
              :app:testArm32DebugUnitTest \
              :app:testArm64DebugUnitTest \
              :app:testX86DebugUnitTest \
              :app:testX64DebugUnitTest
          else
            gradle --no-daemon :app:testDebugUnitTest
          fi

  package-abi-apks:
    if: needs.detect.outputs.has_abi_packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate and stage ABI-matched bootstrap bundles
        run: bash scripts/prepare-bootstrap-assets.sh
      - name: Build one APK per ABI
        run: gradle --no-daemon :app:assembleArm32Debug :app:assembleArm64Debug :app:assembleX86Debug :app:assembleX64Debug
      - name: Verify each APK embeds its matching bootstrap
        run: bash scripts/verify-bootstrap-apks.sh
      - name: Upload ABI-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: cpp-ide-abi-apks
          path: |
            app/build/outputs/apk/arm32/debug/*.apk
            app/build/outputs/apk/arm64/debug/*.apk
            app/build/outputs/apk/x86/debug/*.apk
            app/build/outputs/apk/x64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
